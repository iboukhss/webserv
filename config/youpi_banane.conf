server {
    listen 8080;
    root /tests;

    allow_methods GET;

    cgi_handler .bla /tests/ubuntu_cgi_tester;
    cgi_allow_methods POST;

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    location /directory/ {
        alias /absolute/path/YoupiBanane;
        allow_methods GET;
        index youpi.bad_extension;
    }
}
