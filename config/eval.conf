server {
    listen 8080;

    root www/eval;
    index index.html;

    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 500 /errors/500.html;

    location / {
        allow_methods GET;

    }

    location /post_body {
        allow_methods POST;
    }

    location /assets/ {
        allow_methods GET;
    }

    location /delete_me/ {
        allow_methods GET DELETE;
    }

    location /cgi-py/ {
        allow_methods GET POST;
        cgi_handler .py /usr/bin/python3;
    }

    location /cgi-bin/ {
        allow_methods GET POST;
        cgi_handler .bla /bin/sh;
    }
}
