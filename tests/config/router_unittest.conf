server {
    listen 8080;
    root /tmp/www;

    location / {
        allow_methods GET;
    }

    location /files {
        allow_methods DELETE;
    
    }

    location /files/private {
        allow_methods POST;
        allow_uploads off;
    
    }

    location /upload {
        allow_methods POST;
        allow_uploads on;
        upload_store /tmp/store;
    }

    location /cgi-bin/ {
        cgi_allow_methods GET POST;
    }
}
